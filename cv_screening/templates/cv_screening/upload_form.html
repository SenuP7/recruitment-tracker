<!DOCTYPE html>
<html>
<head>
    <title>CV Screening</title>
</head>
<body>
    {% if messages %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <h1>CV Screening</h1>

    <h2>Role: {{ role_profile.role_name }}</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="candidate">Candidate:</label>

        <select
            id="candidate"
            name="candidate"
            required
        >
            <option value="">-- Select Candidate --</option>

            {% for candidate in candidates %}
                <option value="{{ candidate.id }}">
                    {{ candidate.first_name }} {{ candidate.last_name }}
                </option>
            {% endfor %}

        </select>

        <br><br>

        <label for="cv_file">Upload CV:</label>

        <input
            type="file"
            id="cv_file"
            name="cv_file"
            accept=".pdf,.docx"
            required
        >

        <p>
            Accepted formats: PDF, DOCX<br>
            Maximum file size: 5 MB
        </p>

        <br><br>

        <button type="submit">Screen CV</button>

    </form>

</body>
</html>
