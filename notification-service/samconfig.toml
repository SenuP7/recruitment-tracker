version = 0.1

[default.deploy.parameters]
stack_name = "recruitment-tracker-notifications"
region = "ap-southeast-1"
# NAMED, not plain CAPABILITY_IAM: the stack creates a managed policy with
# an explicit name (RecruitmentTrackerNotificationPublish), which the README
# and the EB role attachment both refer to. CloudFormation refuses to create
# a named IAM resource without this.
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
# SenderEmail has no default deliberately -- pass --parameter-overrides
# SenderEmail=you@example.com on first deploy, or answer the guided prompt.
# This must match the AlertEmail already on the deployed stack. An SNS email
# subscription cannot be updated in place: change this value and CloudFormation
# deletes the confirmed subscription and creates a new one, which then sits
# unconfirmed until somebody clicks the link in that inbox -- so DLQ alerts go
# nowhere in the meantime, silently. A stale PendingConfirmation entry on the
# topic is the fingerprint of that having happened before.
parameter_overrides = "AlertEmail=ansy.pppm@gmail.com"

[default.build.parameters]
cached = true
parallel = true
