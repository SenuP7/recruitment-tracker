{% extends "base.html" %}

{% block title %}Upload CV{% endblock %}

{% block content %}

<div class="page-head">
    <h1>Upload Candidate CV</h1>
</div>

<div class="panel">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Upload CV</button>
    </form>
</div>

{% endblock %}
