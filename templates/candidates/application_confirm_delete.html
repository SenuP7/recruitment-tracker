{% extends "base.html" %}

{% block title %}Delete Application{% endblock %}

{% block content %}

<div class="page-head">
    <h1>Delete Application</h1>
</div>

<div class="panel">
    <p>Are you sure you want to delete this application?</p>
    <p>Candidate: <strong>{{ application.candidate }}</strong></p>
    <p>Position: <strong>{{ application.position }}</strong></p>

    <form method="post">
        {% csrf_token %}
        <div class="actions-bar">
            <button type="submit" class="btn-danger">Yes, Delete</button>
            <a href="{% url 'application-detail' application.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
