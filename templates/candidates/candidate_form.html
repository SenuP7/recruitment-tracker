{% extends "base.html" %}

{% block title %}{% if object %}Edit Candidate{% else %}Add Candidate{% endif %}{% endblock %}

{% block content %}

<div class="page-head">
    {% if object %}
        <h1>Edit Candidate</h1>
    {% else %}
        <h1>Add Candidate</h1>
    {% endif %}
</div>

<div class="panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions-bar">
            <button type="submit" class="btn-primary">Save</button>
            <a href="{% url 'candidate-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
