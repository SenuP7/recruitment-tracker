<!DOCTYPE html>
<html>
<head>
    <title>Candidate Form</title>
</head>
<body>

{% if object %}
    <h1>Edit Candidate</h1>
{% else %}
    <h1>Add Candidate</h1>
{% endif %}

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save</button>

</form>

<br>

<a href="{% url 'candidate-list' %}">
    Cancel
</a>

</body>
</html>
