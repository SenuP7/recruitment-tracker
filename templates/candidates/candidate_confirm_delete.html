<!DOCTYPE html>
<html>
<head>
    <title>Delete Candidate</title>
</head>
<body>

<h1>Delete Candidate</h1>

<p>
    Are you sure you want to delete
    <strong>
        {{ candidate.first_name }} {{ candidate.last_name }}
    </strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'candidate-detail' candidate.pk %}">
    Cancel
</a>

</body>
</html>
