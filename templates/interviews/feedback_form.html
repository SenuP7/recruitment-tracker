<!DOCTYPE html>
<html>
<head>
    <title>Interview Feedback</title>
</head>
<body>

{% if object %}
    <h1>Edit Interview Feedback</h1>
{% else %}
    <h1>Create Interview Feedback</h1>
{% endif %}

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Feedback
    </button>

</form>

<br>

<a href="{% url 'interview-list' %}">
    Cancel
</a>

</body>
</html>
