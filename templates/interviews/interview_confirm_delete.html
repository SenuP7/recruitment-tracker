<!DOCTYPE html>
<html>
<head>
    <title>Delete Interview</title>
</head>
<body>

<h1>Delete Interview</h1>

<p>
    Are you sure you want to delete this interview?
</p>

<p>
    Application: {{ interview.application }}
</p>

<p>
    Type: {{ interview.interview_type }}
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'interview-detail' interview.pk %}">
    Cancel
</a>

</body>
</html>
