{% extends "base.html" %}

{% block title %}Delete Interview{% endblock %}

{% block content %}

<div class="page-head">
    <h1>Delete Interview</h1>
</div>

<div class="panel">
    <p>Are you sure you want to delete this interview?</p>
    <p>Application: <strong>{{ interview.application }}</strong></p>
    <p>Type: <strong>{{ interview.interview_type }}</strong></p>

    <form method="post">
        {% csrf_token %}
        <div class="actions-bar">
            <button type="submit" class="btn-danger">Yes, Delete</button>
            <a href="{% url 'interview-detail' interview.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
