{% extends "base.html" %}

{% block title %}{% if object %}Edit Interview{% else %}Create Interview{% endif %}{% endblock %}

{% block content %}

<div class="page-head">
    {% if object %}
        <h1>Edit Interview</h1>
    {% else %}
        <h1>Create Interview</h1>
    {% endif %}
</div>

<div class="panel">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions-bar">
            <button type="submit" class="btn-primary">Save Interview</button>
            <a href="{% url 'interview-list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
