<!DOCTYPE html>
<html>
<head>
    <title>Delete Feedback</title>
</head>
<body>

<h1>Delete Interview Feedback</h1>

<p>
    Are you sure you want to delete this feedback?
</p>

<p>
    Interview: {{ feedback.interview }}
</p>

<p>
    Rating: {{ feedback.rating }}
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'feedback-detail' feedback.pk %}">
    Cancel
</a>

</body>
</html>
