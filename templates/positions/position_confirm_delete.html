{% extends "base.html" %}

{% block title %}Delete Position{% endblock %}

{% block content %}

<div class="page-head">
    <h1>Delete Position</h1>
</div>

<div class="panel">
    <p>Are you sure you want to delete <strong>{{ position.title }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <div class="actions-bar">
            <button type="submit" class="btn-danger">Yes, Delete</button>
            <a href="{% url 'position-detail' position.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
