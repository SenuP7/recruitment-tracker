<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment Tracker - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            width: 360px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 25px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Recruitment Tracker</h1>

    <form method="post">

        {% csrf_token %}

        <label for="id_username">Username</label>
        <input
            type="text"
            name="username"
            id="id_username"
            required
        >

        <label for="id_password">Password</label>
        <input
            type="password"
            name="password"
            id="id_password"
            required
        >

        {% if form.errors %}
            <div class="error">
                Invalid username or password.
            </div>
        {% endif %}

        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
